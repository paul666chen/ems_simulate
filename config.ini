[database]
# 数据库类型: sqlite 或 mysql
type = sqlite
# SQLite 数据库路径（type=sqlite时生效）
sqlite_path = data/ems.db

[mysql]
host = 127.0.0.1
port = 3306
username = nandu
password = nandu123
database = net

# 来源选择 db 或 csv
[data_source]
type = db

# 后端服务配置
[server]
# 服务监听地址：127.0.0.1 仅本机访问；改为 0.0.0.0 允许局域网访问
host = 127.0.0.1
port = 9002

# 报文落盘日志
[log]
# IEC104 收发报文写入 log/iec104_message.log（含解析摘要），on 开启 / off 关闭
# 也可用环境变量 EMS_IEC104_MESSAGE_LOG=0 临时关闭
iec104_message = on